<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110; --surface:#1B1815; --surface-2:#211E19;
  --border:rgba(244,241,236,0.09); --border-soft:rgba(244,241,236,0.06); --border-strong:rgba(244,241,236,0.16);
  --text:#F5F2EC; --text-muted:#A39D91; --text-faint:#86807D; --text-disabled:#5C574E;
  --accent:#CDA655; --accent-soft:#E6CFA0; --accent-deep:#8F7038;
  --font:'Inter Tight', system-ui, -apple-system, sans-serif;
}
body{margin:0;background:#0b0a09;font-family:var(--font)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-soft)}
</style>
</helmet>
<div style="width:390px;height:844px;border-radius:56px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 40px 90px rgba(0,0,0,0.5),0 0 0 1px rgba(244,241,236,0.06);font-family:var(--font)">
  <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50"></div>
  <div style="display:flex;flex-direction:column;height:100%">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 28px 0;box-sizing:border-box;position:relative;z-index:20">
      <div style="font-family:var(--font);font-weight:600;font-size:16px;color:var(--text)">9:41</div>
      <div style="display:flex;align-items:center;gap:6px">
        <svg width="18" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#F5F2EC"></rect><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#F5F2EC"></rect><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#F5F2EC"></rect><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#F5F2EC"></rect></svg>
        <svg width="16" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#F5F2EC"></path><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#F5F2EC"></path><circle cx="8.5" cy="10.5" r="1.5" fill="#F5F2EC"></circle></svg>
        <svg width="25" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#F5F2EC" stroke-opacity="0.4" fill="none"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="#F5F2EC"></rect><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#F5F2EC" fill-opacity="0.4"></path></svg>
      </div>
    </div>
    <div style="padding:36px 24px 16px;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box;border-bottom:1px solid var(--border-soft)">
      <div style="font-family:var(--font);font-weight:700;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.02em">Annuler</div>
      <div style="text-align:center">
        <div style="font-family:var(--font);font-weight:800;font-size:13px;color:var(--text);text-transform:uppercase;letter-spacing:0.01em">Push</div>
        <div style="font-family:var(--font);font-weight:700;font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:2px">14:32</div>
      </div>
      <div style="font-family:var(--font);font-weight:800;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.02em">Terminer</div>
    </div>
    <div style="flex:1;overflow:auto;padding:22px 28px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
      <div style="background:linear-gradient(160deg,#201C17,#141210);border-radius:26px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 36px -18px rgba(0,0,0,0.6);border:1px solid var(--border)">
        <div>
          <div style="font-family:var(--font);font-weight:700;font-size:10px;letter-spacing:0.14em;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px">Repos</div>
          <div style="font-family:var(--font);font-weight:800;font-size:28px;color:var(--accent);font-variant-numeric:tabular-nums">01:24</div>
        </div>
        <div style="width:78px;height:5px;border-radius:999px;background:rgba(244,241,236,0.12)"><div style="width:60%;height:100%;border-radius:999px;background:var(--accent)"></div></div>
      </div>
      <div>
        <div style="font-family:var(--font);font-weight:700;font-size:11px;letter-spacing:0.12em;color:var(--accent);text-transform:uppercase;margin-bottom:6px">Exercice 1/4</div>
        <div style="font-family:var(--font);font-weight:800;font-size:22px;color:var(--text);margin-bottom:16px;letter-spacing:-0.01em">Développé couché</div>
        <div style="display:flex;justify-content:space-between;padding:0 4px 10px;font-family:var(--font);font-weight:700;font-size:10px;letter-spacing:0.08em;color:var(--text-faint);text-transform:uppercase;border-bottom:1px solid var(--border-soft)">
          <div style="width:20%">Série</div><div style="width:25%">Kg</div><div style="width:25%">Reps</div><div style="width:20%;text-align:right">✓</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border-soft);font-family:var(--font);font-weight:700;font-size:14px;color:var(--text)">
          <div style="width:20%">1</div><div style="width:25%">60</div><div style="width:25%">8</div><div style="width:20%;text-align:right"><div style="width:22px;height:22px;border-radius:999px;background:var(--accent);display:inline-block"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border-soft);font-family:var(--font);font-weight:700;font-size:14px;color:var(--text)">
          <div style="width:20%">2</div><div style="width:25%">60</div><div style="width:25%">8</div><div style="width:20%;text-align:right"><div style="width:22px;height:22px;border-radius:999px;background:var(--accent);display:inline-block"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border-soft);font-family:var(--font);font-weight:700;font-size:14px;color:var(--text)">
          <div style="width:20%">3</div><div style="width:25%">60</div><div style="width:25%">7</div><div style="width:20%;text-align:right"><div style="width:20px;height:20px;border-radius:999px;border:2px solid var(--accent);display:inline-block"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 4px;font-family:var(--font);font-weight:700;font-size:14px;color:var(--text-disabled)">
          <div style="width:20%">4</div><div style="width:25%">—</div><div style="width:25%">—</div><div style="width:20%;text-align:right"><div style="width:20px;height:20px;border-radius:999px;border:2px solid var(--border-strong);display:inline-block"></div></div>
        </div>
      </div>
      <button style="background:transparent;border:1px solid var(--border-strong);border-radius:999px;color:var(--text);padding:15px;font-family:var(--font);font-weight:700;font-size:12px;letter-spacing:0.03em;cursor:pointer">+ Ajouter une série</button>
      <button style="background:var(--accent);color:var(--bg);border:none;border-radius:999px;padding:18px;font-family:var(--font);font-weight:800;font-size:13px;letter-spacing:0.03em;cursor:pointer;box-shadow:0 14px 28px -12px rgba(205,166,85,0.45)">Exercice suivant</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
